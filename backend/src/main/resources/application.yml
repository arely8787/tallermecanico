spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taller?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci}
    username: ${DB_USER:taller_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  compression:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  error:
    include-message: never
postal:
  catalog-path: ${POSTAL_CATALOG_PATH:data/CPdescarga.txt}
